name: format

on:
  workflow_call:

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: install
        run: yarn install

      - name: format:check
        run: yarn format:check
