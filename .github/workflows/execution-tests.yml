name: execution tests

on:
  workflow_call:

jobs:
  execution_test_ubuntu:
    name: ubuntu
    strategy:
      matrix:
        node: [26, 24, 22]
        ts: [7.1.0-beta, next]
        webpack: [4, 5]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - uses: ./.github/actions/build-ts-loader

      - name: install typescript
        run: npm install -D typescript@${{ matrix.ts }}

      - name: install webpack 4
        if: matrix.webpack == 4
        run: npm install -D webpack@^4.47.0 karma-webpack@^4.0.2

      - name: test
        run: npm run execution-tests

  execution_test_macos:
    name: macOS
    strategy:
      matrix:
        node: [26, 24, 22]
        ts: [7.1.0-beta, next]
        webpack: [4, 5]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - uses: ./.github/actions/build-ts-loader

      - name: install typescript
        run: npm install -D typescript@${{ matrix.ts }}

      - name: install webpack 4
        if: matrix.webpack == 4
        run: npm install -D webpack@^4.47.0 karma-webpack@^4.0.2

      - name: test
        run: npm run execution-tests

  execution_test_windows:
    name: windows
    strategy:
      matrix:
        node: [26, 24, 22]
        ts: [7.1.0-beta, next]
        webpack: [4, 5]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - uses: ./.github/actions/build-ts-loader

      - name: install typescript
        run: npm install -D typescript@${{ matrix.ts }}
        working-directory: C:\source\ts-loader

      - name: install webpack 4
        if: matrix.webpack == 4
        run: npm install -D webpack@^4.47.0 karma-webpack@^4.0.2
        working-directory: C:\source\ts-loader

      - name: test
        run: npm run execution-tests
        working-directory: C:\source\ts-loader
