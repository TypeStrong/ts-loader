name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  comparison-tests:
    name: comparison tests
    uses: ./.github/workflows/comparison-tests.yml

  execution-tests:
    name: execution tests
    uses: ./.github/workflows/execution-tests.yml

  minimum-node-tests:
    name: minimum node tests
    uses: ./.github/workflows/minimum-node-tests.yml

  lint:
    name: lint
    uses: ./.github/workflows/lint.yml

  format:
    name: format
    uses: ./.github/workflows/format.yml

  knip:
    name: knip
    uses: ./.github/workflows/knip.yml
