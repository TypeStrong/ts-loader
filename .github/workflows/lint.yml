name: lint

on:
  workflow_call:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: ./.github/actions/build-ts-loader

      - name: lint
        run: npm run lint

      - name: type-check comparison test harness
        run: npm run check:comparison-tests

      - name: type-check execution test harness
        run: npm run check:execution-tests
