name: build and test

on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  comparison_test_ubuntu:
    name: Comparison Tests Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: install
        run: yarn install

      - name: build
        run: yarn build

      - name: test
        run: sudo yarn comparison-tests

  comparison_test_windows:
    name: Comparison Tests Windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: copy files
        shell: pwsh
        run: |
          New-Item C:\source\ts-loader -ItemType Directory
          Copy-Item .\* C:\source\ts-loader -Recurse -Force

      - name: install
        run: yarn install
        working-directory: C:\source\ts-loader

      - name: build
        run: yarn build
        working-directory: C:\source\ts-loader

      - name: test
        run: yarn comparison-tests
        working-directory: C:\source\ts-loader

  execution_test_ubuntu:
    name: Execution Tests Ubuntu
    strategy:
      matrix:
        node: [26, 24, 22]
        ts: [7.1.0-dev.20260902.1, next]
        webpack: [4, 5]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: install
        run: yarn install

      - name: build
        run: yarn build

      - name: install typescript
        run: yarn add typescript@${{ matrix.ts }}

      - name: install webpack 4
        if: matrix.webpack == 4
        run: yarn add webpack@^4.47.0 karma-webpack@^4.0.2

      - name: test
        run: yarn execution-tests

  execution_test_windows:
    name: Execution Tests Windows
    strategy:
      matrix:
        node: [26, 24, 22]
        ts: [7.1.0-dev.20260902.1, next]
        webpack: [4, 5]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: copy files
        shell: pwsh
        run: |
          New-Item C:\source\ts-loader -ItemType Directory
          Copy-Item .\* C:\source\ts-loader -Recurse -Force

      - name: install
        run: yarn install
        working-directory: C:\source\ts-loader

      - name: build
        run: yarn build
        working-directory: C:\source\ts-loader

      - name: install typescript
        run: yarn add typescript@${{ matrix.ts }}
        working-directory: C:\source\ts-loader

      - name: install webpack 4
        if: matrix.webpack == 4
        run: yarn add webpack@^4.47.0 karma-webpack@^4.0.2
        working-directory: C:\source\ts-loader

      - name: test
        run: yarn execution-tests
        working-directory: C:\source\ts-loader

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install
        run: yarn install

      - name: lint
        run: yarn lint

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install
        run: yarn install

      - name: format:check
        run: yarn format:check

  knip:
    name: Knip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install
        run: yarn install

      - name: knip
        run: yarn knip
