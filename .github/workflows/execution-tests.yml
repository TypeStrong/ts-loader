name: execution tests

on:
  workflow_call:

jobs:
  execution_test_ubuntu:
    name: ubuntu
    strategy:
      matrix:
        node: [26, 24, 22]
        ts: [5.7.2, 5.8.2, 5.9.2, 6.0.2] # next excluded for now
        webpack: [4, 5]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - uses: ./.github/actions/build-ts-loader

      - name: install typescript
        run: pnpm add -D typescript@${{ matrix.ts }}

      - name: install webpack 4
        if: matrix.webpack == 4
        run: pnpm add -D webpack@^4.47.0 karma-webpack@^4.0.2

      - name: test
        run: pnpm execution-tests

