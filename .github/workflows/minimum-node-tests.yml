name: minimum node tests

on:
  workflow_call:

jobs:
  minimum_node_tests:
    name: node 16.20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Dev dependencies need newer Node, so install and build on 26...
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - uses: ./.github/actions/build-ts-loader

      # ...then run ts-loader itself on the minimum Node from package.json `engines`.
      - uses: actions/setup-node@v7
        with:
          node-version: 16.20.0

      - name: test
        run: node --version && node test/minimum-node-tests/run-tests.js
