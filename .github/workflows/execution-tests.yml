  execution_test_windows:
    name: windows
    strategy:
      matrix:
        node: [26, 24, 22]
        ts: [5.7.2, 5.8.2, 5.9.2, 6.0.2] # next excluded for now
        webpack: [4, 5]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # setup-node resolves the store from the checkout (D:), but installs run under
      # C:\source\ts-loader, so pin the store or the cache post-step finds nothing.
      - name: pin pnpm store
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'pnpm_config_store_dir=C:\pnpm-store' >> "$GITHUB_ENV"

      - name: install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - uses: ./.github/actions/build-ts-loader

      - name: install typescript
        run: pnpm add -D typescript@${{ matrix.ts }}
        working-directory: C:\source\ts-loader

      - name: install webpack 4
        if: matrix.webpack == 4
        run: pnpm add -D webpack@^4.47.0 karma-webpack@^4.0.2
        working-directory: C:\source\ts-loader

      - name: test
        run: pnpm execution-tests
        working-directory: C:\source\ts-loader
