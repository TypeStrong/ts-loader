name: comparison tests

on:
  workflow_call:

jobs:
  comparison_test_ubuntu:
    name: ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: ./.github/actions/build-ts-loader

      - name: test
        run: pnpm comparison-tests

  comparison_test_macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: ./.github/actions/build-ts-loader

      - name: test
        run: pnpm comparison-tests

  comparison_test_windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # setup-node resolves the store from the checkout (D:), but installs run under
      # C:\source\ts-loader, so pin the store or the cache post-step finds nothing.
      - name: pin pnpm store
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'pnpm_config_store_dir=C:\pnpm-store' >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: ./.github/actions/build-ts-loader

      - name: test
        run: pnpm comparison-tests
        working-directory: C:\source\ts-loader
